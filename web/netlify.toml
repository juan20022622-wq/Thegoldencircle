# Netlify · The Golden Syndicate
# El sitio vive en web/. Configurar "Base directory: web" en la UI de Netlify
# o dejar que este archivo lo resuelva si el repo se conecta desde la raíz.

[build]
  base    = "web"
  publish = "."
  command = ""

# Redirect propio al broker. NO se enlaza desde la landing:
# se usa en la bio de Instagram y dentro del canal de Telegram.
# ir.html registra el origen (píxel + UTM) y de ahí manda a Exness.
[[redirects]]
  from   = "/broker"
  to     = "/ir.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/ir"
  to     = "/ir.html"
  status = 200

# /plan/ es la herramienta interna: el banco de mensajes, la semana y la
# estrategia en PDF. Va detrás de contraseña en el borde, antes de servir nada.
# La contraseña NO está en el repo: es la variable PLAN_CLAVE de Netlify.
# Sin la variable la ruta responde 503 y lo dice; nunca queda abierta.
[[edge_functions]]
  path     = "/plan"
  function = "clave"

[[edge_functions]]
  path     = "/plan/*"
  function = "clave"

[[headers]]
  for = "/plan/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # No hay ni un script en línea en el sitio: los de gracias.html e ir.html
    # se sacaron a archivo justamente para poder prohibirlos aquí.
    #
    # style-src conserva unsafe-inline porque los retrasos del revelado viajan
    # como style="--retraso:120ms" en el atributo. Son estilos, no código: no
    # ejecutan nada. Quitarlo exigiría mover cada retraso a una clase.
    #
    # connect.facebook.net y www.facebook.com son para el píxel de Meta.
    # VERIFICADA con el píxel instalado (2026-09-08): fbevents.js carga, la
    # configuración del píxel baja y el PageView llega a www.facebook.com/tr con
    # el ID correcto. La consola muestra dos bloqueos a hosts tipo
    # *.run.app y *.on.aws (/events?cee=no): son beacons auxiliares de Meta a
    # dominios aleatorios que no se pueden poner en lista. Es lo esperado, no un
    # fallo: la medición va por www.facebook.com/tr y esa sí pasa.
    Content-Security-Policy = """default-src 'self'; \
      script-src 'self' https://connect.facebook.net; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: https://www.facebook.com; \
      connect-src 'self' https://www.facebook.com; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      object-src 'none'"""

# Los archivos de assets NO llevan hash en el nombre, así que no pueden
# cachearse como inmutables: el navegador se quedaría con la versión vieja para
# siempre y ningún arreglo llegaría a quien ya visitó la página. Pasó.
#
# Con max-age=0 y ETag, el navegador pregunta y Netlify responde 304 si no
# cambió: el coste es un viaje mínimo y la corrección está garantizada.
# El día que haya build con nombres hasheados, se puede volver a immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
